name: Auto Build & Validate IPTV Source

on:
  schedule:
    - cron: '0 */4 * * *' # 每 4 小时自动触发一次（北京时间 00:00, 04:00, 08:00, 12:00, 16:00, 20:00）
  workflow_dispatch: # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp

      - name: Run Validation and Build
        run: python build.py

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=my-iptv-live --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
